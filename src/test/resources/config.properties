# Servidor Appium
appium.server.url=http://127.0.0.1:4723

# Capacidades del dispositivo / emulador
platformName=Android
automationName=UiAutomator2
deviceName=emulator-5554
platformVersion=15
# Perfil visual del AVD: ejecutar scripts\Configurar-Emulador.ps1 antes de las pruebas.
# 1080x1920 fisicos, 240 dpi, texto 100%, orientacion vertical (sin cambiar CSS).

# Solo para SmokeTest nativo ejecutado explicitamente; la suite predeterminada usa Chrome
appPackage=com.android.settings
appActivity=.Settings

# Navegador y sitio bajo prueba para pruebas móviles web
browserName=Chrome
# En CI efimero se usa false para que ChromeDriver prepare Chrome desde cero.
chrome.useRunningApp=true
# Al finalizar se detiene Chrome sin borrar datos y se vuelve a Inicio.
# En SmokeTest se detiene solo el appPackage configurado arriba.
web.base.url=https://brave-mud-0605ba20f.3.azurestaticapps.net/

# Tiempos de espera (segundos)
newCommandTimeout=120
implicitWait=10
explicitWait=15

# Pausa visual despues de cada paso exitoso (milisegundos)
step.pause.ms=1500
