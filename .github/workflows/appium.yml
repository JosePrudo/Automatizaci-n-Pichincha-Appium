name: Pruebas Appium Android

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appium-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Flujo completo en Chrome Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v4

      - name: Preparar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar generador de reportes
        run: |
          mvn --batch-mode --no-transfer-progress -Dtest=ReporteEjecucionTest test
          rm -f target/surefire-reports/testng-results.xml

      - name: Instalar Appium y UiAutomator2
        run: |
          npm install --global appium@3.8.0
          appium driver install uiautomator2@8.7.1

      - name: Habilitar aceleracion del emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Ejecutar simulacion en Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ci-appium.sh

      - name: Publicar resumen sin datos personales
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import xml.etree.ElementTree as ET
          path = pathlib.Path("target/surefire-reports/testng-results.xml")
          lines = ["## Resultado de pruebas Appium", ""]
          if path.exists():
              root = ET.parse(path).getroot()
              lines += [
                  "| Total | Aprobadas | Fallidas | Omitidas |",
                  "| --- | --- | --- | --- |",
                  "| " + " | ".join(root.get(key, "0") for key in ("total", "passed", "failed", "skipped")) + " |",
                  "",
                  "Fallos de configuracion: " + str(len(root.findall(".//test-method[@is-config='true'][@status='FAIL']"))),
              ]
          else:
              lines += ["No se genero un resultado funcional. Revisa las etapas de preparacion."]
          lines += ["", "No se publican capturas, HTML, datos del formulario ni logs del servicio en este repositorio publico."]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\n".join(lines) + "\n")
          PY
